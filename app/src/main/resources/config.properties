# ============================================================
# Appium Configuration
# ============================================================
appium.server.url=http://127.0.0.1:4723

# ============================================================
# Device Configuration
# ============================================================
platform.name=Android
automation.name=UiAutomator2
platform.version=14
device.name=emulator-5554
device.udid=emulator-5554

# ============================================================
# Application Configuration
# ============================================================
app.package=com.saucelabs.mydemoapp.rn
app.activity=com.saucelabs.mydemoapp.rn.MainActivity
app.no.reset=false

# ============================================================
# Timeout Configuration (in seconds)
# ============================================================
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# ============================================================
# Valid Test Credentials
# ============================================================
valid.username=bob@example.com
valid.password=10203040

# ============================================================
# Invalid Test Credentials  (used for negative tests)
# ============================================================
invalid.username=invalid@example.com
invalid.password=wrongpassword
empty.username=
empty.password=
locked.username=locked@example.com
locked.password=10203040

# ============================================================
# Report Configuration
# ============================================================
report.path=reports/extent-report/ExtentReport.html
screenshot.path=reports/screenshots/
video.path=reports/videos/
log.path=reports/logs/execution.log

# ============================================================
# Retry Configuration
# ============================================================
retry.count=1
